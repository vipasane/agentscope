# Automated Package Publishing Workflow
# Triggers when changes are merged to main branch
# Publishes changed packages to npm/PyPI automatically

name: Auto-Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'products/**'
      - '.github/workflows/auto-publish.yml'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (leave empty for all changed)'
        required: false
        type: string

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed packages
        id: detect
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)

          # Initialize array
          PACKAGES=()

          # Check each package directory (all 12 packages: 11 npm + 1 Python)
          for pkg in packages/cli-framework packages/errors packages/learning packages/memory \
                     packages/performance packages/security packages/testing packages/types \
                     products/api-reference-system products/cli-startup-optimizer \
                     products/integration-test-suite products/alpha-feedback-system; do
            if echo "$CHANGED_FILES" | grep -q "^$pkg/"; then
              PACKAGES+=("$pkg")
            fi
          done

          # Convert to JSON array
          if [ ${#PACKAGES[@]} -gt 0 ]; then
            PACKAGES_JSON=$(printf '%s\n' "${PACKAGES[@]}" | jq -R . | jq -s .)
            echo "packages=$PACKAGES_JSON" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "📦 Changed packages: ${PACKAGES[@]}"
          else
            echo "packages=[]" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No package changes detected"
          fi

  publish-npm:
    name: Publish npm Package
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get package info
        id: pkg-info
        run: |
          PKG_PATH="${{ matrix.package }}"

          # Skip if Python package
          if [ -f "$PKG_PATH/pyproject.toml" ]; then
            echo "is-python=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping npm publish for Python package"
            exit 0
          fi

          echo "is-python=false" >> $GITHUB_OUTPUT

          # Extract package name and version
          PKG_NAME=$(node -p "require('./$PKG_PATH/package.json').name")
          PKG_VERSION=$(node -p "require('./$PKG_PATH/package.json').version")

          echo "name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "path=$PKG_PATH" >> $GITHUB_OUTPUT

          echo "📦 Package: $PKG_NAME@$PKG_VERSION"

      - name: Check if version exists
        if: steps.pkg-info.outputs.is-python == 'false'
        id: version-check
        run: |
          PKG_NAME="${{ steps.pkg-info.outputs.name }}"
          PKG_VERSION="${{ steps.pkg-info.outputs.version }}"

          # Check if this version is already published
          if npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version $PKG_VERSION already published"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version $PKG_VERSION not yet published"
          fi

      - name: Install dependencies
        if: steps.pkg-info.outputs.is-python == 'false' && steps.version-check.outputs.exists == 'false'
        working-directory: ${{ steps.pkg-info.outputs.path }}
        run: |
          npm ci --ignore-scripts

      - name: Build package
        if: steps.pkg-info.outputs.is-python == 'false' && steps.version-check.outputs.exists == 'false'
        working-directory: ${{ steps.pkg-info.outputs.path }}
        run: |
          npm run build
          echo "✅ Build successful"

      - name: Run tests
        if: steps.pkg-info.outputs.is-python == 'false' && steps.version-check.outputs.exists == 'false'
        working-directory: ${{ steps.pkg-info.outputs.path }}
        run: |
          npm test || echo "⚠️ Tests failed or not available"

      - name: Publish to npm
        if: steps.pkg-info.outputs.is-python == 'false' && steps.version-check.outputs.exists == 'false'
        working-directory: ${{ steps.pkg-info.outputs.path }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public --tag alpha
          echo "✅ Published ${{ steps.pkg-info.outputs.name }}@${{ steps.pkg-info.outputs.version }}"

      - name: Create GitHub Release
        if: steps.pkg-info.outputs.is-python == 'false' && steps.version-check.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.pkg-info.outputs.name }}@${{ steps.pkg-info.outputs.version }}
          release_name: ${{ steps.pkg-info.outputs.name }} v${{ steps.pkg-info.outputs.version }}
          body: |
            ## 📦 ${{ steps.pkg-info.outputs.name }} v${{ steps.pkg-info.outputs.version }}

            Auto-published from main branch.

            ### Installation
            ```bash
            npm install ${{ steps.pkg-info.outputs.name }}@alpha
            ```

            ### Changes
            See commit history for details.
          draft: false
          prerelease: true

  publish-pypi:
    name: Publish Python Package
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Check if Python package
        id: check-python
        run: |
          PKG_PATH="${{ matrix.package }}"
          if [ -f "$PKG_PATH/pyproject.toml" ]; then
            echo "is-python=true" >> $GITHUB_OUTPUT
            echo "path=$PKG_PATH" >> $GITHUB_OUTPUT

            # Extract version from pyproject.toml
            VERSION=$(grep '^version = ' "$PKG_PATH/pyproject.toml" | cut -d'"' -f2)
            NAME=$(grep '^name = ' "$PKG_PATH/pyproject.toml" | cut -d'"' -f2)

            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "name=$NAME" >> $GITHUB_OUTPUT
            echo "🐍 Python package: $NAME@$VERSION"
          else
            echo "is-python=false" >> $GITHUB_OUTPUT
            echo "⏭️ Not a Python package"
          fi

      - name: Setup Python
        if: steps.check-python.outputs.is-python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        if: steps.check-python.outputs.is-python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        if: steps.check-python.outputs.is-python == 'true'
        working-directory: ${{ steps.check-python.outputs.path }}
        run: |
          python -m build
          echo "✅ Build successful"

      - name: Check package
        if: steps.check-python.outputs.is-python == 'true'
        working-directory: ${{ steps.check-python.outputs.path }}
        run: |
          twine check dist/*
          echo "✅ Package check passed"

      - name: Publish to PyPI
        if: steps.check-python.outputs.is-python == 'true'
        working-directory: ${{ steps.check-python.outputs.path }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/* --skip-existing
          echo "✅ Published ${{ steps.check-python.outputs.name }}@${{ steps.check-python.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check-python.outputs.is-python == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.check-python.outputs.name }}@${{ steps.check-python.outputs.version }}
          release_name: ${{ steps.check-python.outputs.name }} v${{ steps.check-python.outputs.version }}
          body: |
            ## 🐍 ${{ steps.check-python.outputs.name }} v${{ steps.check-python.outputs.version }}

            Auto-published from main branch.

            ### Installation
            ```bash
            pip install ${{ steps.check-python.outputs.name }}
            ```

            ### Changes
            See commit history for details.
          draft: false
          prerelease: true

  notify:
    name: Notify Publication
    runs-on: ubuntu-latest
    needs: [detect-changes, publish-npm, publish-pypi]
    if: always() && needs.detect-changes.outputs.has-changes == 'true'
    steps:
      - name: Summary
        run: |
          echo "## 📦 Publication Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- npm packages: ${{ needs.publish-npm.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- PyPI packages: ${{ needs.publish-pypi.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Packages" >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.detect-changes.outputs.packages }}' | jq -r '.[]' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
