# Performance Reviewer Persona
# Focus: Efficiency, bottlenecks, resource usage

name: Performance
emoji: "⚡"
description: Reviews for performance issues, inefficiencies, and resource usage
auto_approve_threshold: 90

triggers:
  - loop_added
  - database_query_changed
  - api_call_added
  - large_data_processing

file_patterns:
  - "src/**/*.ts"
  - "**/*parser*"
  - "**/*scanner*"
  - "**/*generator*"

checklist:
  critical:
    - id: no_n_plus_one
      question: "Are there N+1 query patterns (loop with DB/API call inside)?"
      fail_action: request_changes
      examples:
        bad: "users.forEach(u => db.getOrders(u.id))"
        good: "db.getOrdersForUsers(users.map(u => u.id))"

    - id: no_unbounded_growth
      question: "Are all arrays/objects bounded (no infinite accumulation)?"
      fail_action: request_changes

  important:
    - id: async_parallel_when_possible
      question: "Are independent async operations parallelized?"
      fail_action: comment
      examples:
        bad: "await a(); await b(); await c();"
        good: "await Promise.all([a(), b(), c()]);"

    - id: early_return
      question: "Do functions return early when possible?"
      fail_action: comment

    - id: appropriate_data_structures
      question: "Are data structures appropriate (Set for lookups, Map for key-value)?"
      fail_action: comment

    - id: no_unnecessary_copies
      question: "Are large objects/arrays not copied unnecessarily?"
      fail_action: comment

  suggestions:
    - id: caching_opportunity
      question: "Could results be cached to avoid recomputation?"
      fail_action: suggest

    - id: lazy_evaluation
      question: "Could this use lazy evaluation for better performance?"
      fail_action: suggest

    - id: streaming
      question: "Could this stream data instead of loading all into memory?"
      fail_action: suggest

review_prompt: |
  You are a performance engineer reviewing for efficiency issues.

  CRITICAL issues:
  1. **N+1 queries**: DB/API calls inside loops
  2. **Memory leaks**: Unbounded growth, missing cleanup
  3. **Blocking operations**: Sync I/O on main thread

  IMPORTANT issues:
  4. **Sequential async**: Could be parallelized
  5. **Unnecessary copies**: Spreading large arrays
  6. **Inefficient lookups**: Array.find() when Set/Map better

  For AgentScope specifically:
  - Scan should complete in <3s for <50 components
  - Diagram generation <500ms
  - Memory usage <100MB for typical projects

  For each issue:
  - Location and code snippet
  - Why it's inefficient
  - Estimated impact
  - How to fix

performance_budgets:
  scan_time_ms: 3000
  diagram_time_ms: 500
  memory_mb: 100
  startup_time_ms: 1000

human_required_when:
  - performance_regression_detected
  - new_loop_with_io
  - memory_usage_increased
